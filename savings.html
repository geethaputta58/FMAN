<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Savings Goals</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">

<div class="container py-5">
  <!-- Header -->
  <header class="mb-4">
    <h1 class="text-center">Savings Goals</h1>
    <p class="text-center text-muted">Track your savings progress and achieve your financial goals!</p>
  </header>

  <!-- Goal Creation Form -->
  <section class="mb-5">
    <div class="card shadow-lg">
      <div class="card-body">
        <h2 class="mb-4">Create New Savings Goal</h2>
        <form id="goalForm" class="needs-validation" novalidate>
          <div class="row g-3">
            <div class="col-md-6">
              <div class="form-outline">
                <input type="text" class="form-control" id="goalName" required>
                <label class="form-label" for="goalName">Goal Title</label>
              </div>
            </div>
            <div class="col-md-3">
              <div class="form-outline">
                <input type="number" class="form-control" id="targetAmount" step="0.01" required>
                <label class="form-label" for="targetAmount">Target Amount ($)</label>
              </div>
            </div>
            <div class="col-md-3">
              <div class="form-outline">
                <input type="date" class="form-control" id="targetDate" required>
                <label class="form-label" for="targetDate">Target Date</label>
              </div>
            </div>
          </div>
          <button type="submit" class="btn btn-primary mt-3">
            <i class="bi bi-plus-circle me-2"></i>Create Goal
          </button>
        </form>
      </div>
    </div>
  </section>

  <!-- List of Goals with Progress Bars -->
  <section id="goalsList" class="mb-5">
    <!-- Example Goal -->
    <div class="card shadow-sm mb-3">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h3 class="h5">Emergency Fund</h3>
          <span class="badge bg-success">Active</span>
        </div>
        <div class="progress" style="height: 25px;">
          <div 
            class="progress-bar bg-success progress-bar-striped"
            role="progressbar"
            style="width: 65%"
            aria-valuenow="6500"
            aria-valuemin="0"
            aria-valuemax="10000">
            $6,500 Saved
          </div>
        </div>
        <div class="row mt-2">
          <div class="col">
            <small class="text-muted">Target: $10,000</small>
          </div>
          <div class="col text-end">
            <small class="text-muted">65% Completed</small>
          </div>
        </div>
      </div>
    </div>

    <!-- Add more goals dynamically here -->
  </section>

  <!-- Savings Performance Charts -->
  <section id="chartsSection">
    <div class="row g-4">
      <!-- Pie Chart -->
      <div class="col-lg-6">
        <div class="card h-100 shadow-sm">
          <div class="card-body">
            <h4>Savings Allocation</h4>
            <canvas id="savingsPieChart"></canvas>
          </div>
        </div>
      </div>

      <!-- Line Chart -->
      <div class="col-lg-6">
        <div class="card h-100 shadow-sm">
          <div class="card-body">
            <h4>Progress Timeline</h4>
            <canvas id="savingsLineChart"></canvas>
          </div>
        </div>
      </div>
    </div>
  </section>

</div>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Chart.js Configuration -->
<script>
// Pie Chart Configuration
const pieCtx = document.getElementById('savingsPieChart').getContext('2d');
new Chart(pieCtx, {
  type: 'pie',
  data: {
    labels: ['Emergency Fund', 'Vacation', 'Education'],
    datasets: [{
      data: [6500, 2300, 4200],
      backgroundColor: ['#4e73df', '#1cc88a', '#36b9cc']
    }]
  },
  options: {
    responsive: true,
    plugins: {
      legend: {
        position: 'top'
      }
    }
  }
});

// Line Chart Configuration
const lineCtx = document.getElementById('savingsLineChart').getContext('2d');
new Chart(lineCtx, {
  type: 'line',
  data: {
    labels: ['Jan', 'Feb', 'Mar', 'Apr'],
    datasets: [{
      label: 'Total Savings',
      data: [2500, 4800, 9000, 11200],
      borderColor: '#4e73df',
      backgroundColor: 'rgba(78,115,223,0.1)',
      tension: 0.4,
      fill: true
    }]
  },
  options: {
    responsive: true,
    scales: {
      y: {
        beginAtZero: true,
        ticks: {
          callback: (value) => `$${value}`
        }
      }
    }
  }
});
</script>

</body>
</html>
