<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Personal Finance Manager</title>
  
  <!-- Bootstrap CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Custom CSS -->
  <style>
    .card {
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .card:hover {
      transform: scale(1.01);
      box-shadow: 0 6px 12px rgba(0,0,0,0.15);
    }
    thead th {
      white-space: nowrap;
      text-align: center;
    }
    tbody td {
      vertical-align: middle;
      text-align: center;
    }
    .btn-warning, .btn-danger {
      padding: 0.3rem 0.6rem;
      font-size: 0.85rem;
    }
    @media (max-width: 768px) {
      .card-text {
        font-size: 0.9rem;
      }
      .btn {
        font-size: 0.8rem;
      }
    }
    .fade-in {
      animation: fadeIn 0.5s ease-in;
    }
    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(10px);}
      to {opacity: 1; transform: translateY(0);}
    }
  </style>
</head>
<body class="p-4">

  <div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2>💰 Personal Finance Manager</h2>
      <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addPaymentModal">
        + Add Payment
      </button>
    </div>

    <!-- View Toggle -->
    <div class="d-flex justify-content-end mb-3">
      <button class="btn btn-outline-secondary me-2" onclick="showTable()">📋 Table View</button>
      <button class="btn btn-outline-secondary" onclick="showCards()">📦 Card View</button>
    </div>

    <!-- Table View -->
    <div id="paymentTable">
      <table class="table table-striped">
        <thead class="table-dark">
          <tr>
            <th>Date</th>
            <th>Category</th>
            <th>Method</th>
            <th>Amount</th>
            <th>Note</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>2025-04-10</td>
            <td>Food</td>
            <td>UPI</td>
            <td>$20</td>
            <td>Lunch at Café</td>
            <td>
              <button class="btn btn-sm btn-warning">✏️</button>
              <button class="btn btn-sm btn-danger">🗑️</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Card View -->
    <div id="paymentCards" class="row d-none">
      <div class="col-md-4 fade-in">
        <div class="card border-danger mb-3">
          <div class="card-body">
            <h5 class="card-title">🍔 Food - $20</h5>
            <p class="card-text">Date: 2025-04-10<br>Method: UPI<br>Note: Lunch at Café</p>
            <button class="btn btn-sm btn-warning">✏️ Edit</button>
            <button class="btn btn-sm btn-danger">🗑️ Delete</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Add Payment Modal -->
  <div class="modal fade" id="addPaymentModal" tabindex="-1" aria-labelledby="addPaymentModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <form class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="addPaymentModalLabel">Add New Payment</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
            <div class="mb-3">
              <label for="amount" class="form-label">Amount ($)</label>
              <input type="number" class="form-control" id="amount" required>
            </div>
            <div class="mb-3">
              <label for="category" class="form-label">Category</label>
              <select class="form-select" id="category">
                <option>Food</option>
                <option>Transport</option>
                <option>Entertainment</option>
                <option>Shopping</option>
                <option>Rent</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="date" class="form-label">Date</label>
              <input type="date" class="form-control" id="date">
            </div>
            <div class="mb-3">
              <label for="method" class="form-label">Payment Method</label>
              <select class="form-select" id="method">
                <option>Cash</option>
                <option>UPI</option>
                <option>Credit Card</option>
                <option>Debit Card</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="note" class="form-label">Notes</label>
              <textarea class="form-control" id="note" rows="2"></textarea>
            </div>
        </div>
        <div class="modal-footer">
          <button type="reset" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-success">Add Payment</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Bootstrap JS Bundle CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- View Toggle Script -->
  <script>
    function showTable() {
      document.getElementById("paymentTable").classList.remove("d-none");
      document.getElementById("paymentCards").classList.add("d-none");
    }
    function showCards() {
      document.getElementById("paymentTable").classList.add("d-none");
      document.getElementById("paymentCards").classList.remove("d-none");
    }
  </script>

</body>
</html>
