<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Finance Dashboard</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="p-4">

  <div class="container">
    <h1 class="mb-4">💰 Personal Finance Dashboard</h1>

    <!-- Pie Chart: Category-wise Spending -->
    <div class="mb-5">
      <h4>📊 Expense by Category</h4>
      <canvas id="categoryPie" height="200"></canvas>
    </div>

    <!-- Bar Chart: Monthly Spending -->
    <div class="mb-5">
      <h4>📈 Monthly Spending</h4>
      <canvas id="monthlyBar" height="200"></canvas>
    </div>
  </div>

  <!-- Chart Initialization -->
  <script>
    // Pie Chart
    const pieCtx = document.getElementById('categoryPie').getContext('2d');
    const pieChart = new Chart(pieCtx, {
      type: 'pie',
      data: {
        labels: ['Food', 'Transport', 'Shopping', 'Entertainment', 'Rent'],
        datasets: [{
          label: 'Category-wise Spending',
          data: [150, 80, 120, 90, 250],
          backgroundColor: ['#dc3545', '#17a2b8', '#ffc107', '#007bff', '#28a745']
        }]
      }
    });

    // Bar Chart
    const barCtx = document.getElementById('monthlyBar').getContext('2d');
    const barChart = new Chart(barCtx, {
      type: 'bar',
      data: {
        labels: ['January', 'February', 'March', 'April', 'May'],
        datasets: [{
          label: 'Monthly Spending ($)',
          data: [400, 350, 450, 300, 500],
          backgroundColor: '#007bff'
        }]
      },
      options: {
        responsive: true,
        scales: {
          y: {
            beginAtZero: true
          }
        }
      }
    });
  </script>

</body>
</html>
