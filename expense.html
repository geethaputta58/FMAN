<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HomeBudget</title>
  <link rel="stylesheet" href="exp.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"/>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">
        <i class="fas fa-home" style="color: orange;"></i>
        <span style="color: green;">HomeBudget</span>
      </div>
      <button class="delete-user-btn">Delete User <i class="fas fa-trash"></i></button>
    </header>

    <h1 class="welcome">Welcome back<span class="username">!</span></h1>

    <div class="main-content">
      <div class="card budget-card">
        <h2>Create budget</h2>
        <div class="form-group">
          <label for="budget-name">Budget Name</label>
          <input type="text" id="budget-name" placeholder="e.g., Groceries" />
        </div>
        <div class="form-group">
          <label for="budget-amount">Amount</label>
          <input type="text" id="budget-amount" placeholder="e.g., 350/-" />
        </div>
        <button type="button" id="create-budget-btn" class="btn">Create budget <i class="fas fa-plus-circle"></i></button>
      </div>

      <div class="card expense-card">
        <h2>Add New Expense</h2>
        <div class="form-group">
          <label for="expense-name">Expense Name</label>
          <input type="text" id="expense-name" placeholder="e.g., Coffee" />
        </div>
        <div class="form-group">
          <label for="expense-amount">Amount</label>
          <input type="text" id="expense-amount" placeholder="e.g., 3.50" />
        </div>
        <div class="form-group">
          <label for="budget-category">Budget Category</label>
          <select id="budget-category">
            <option value="groceries">Groceries</option>
            <option value="groceries">Groceries</option>
            <option value="groceries">Groceries</option>
            <option value="groceries">Groceries</option>
            <option value="groceries">Groceries</option>

          </select>
        </div>
        <button type="button" id="add-expense-btn" class="btn">Add Expense <i class="fas fa-plus-circle"></i></button>
      </div>
    </div>

    <h2 class="section-title">Existing Budgets</h2>
    <div class="budgets-container" id="budgets-container">
      <!-- Budgets will be populated by JavaScript -->
    </div>

    <h2 class="section-title">Recent Expenses</h2>
    <div class="expenses-container" id="recent-expenses">
      <!-- Expenses will be populated by JavaScript -->
    </div>
  </div>

  <!-- Modal for budget details -->
  <div class="modal" id="details-modal">
    <div class="modal-content">
      <span class="close-modal">&times;</span>
      <h2 id="modal-title">Budget Details</h2>
      <div class="budget-summary">
        <div>
          <h4>Total Budget</h4>
          <p id="modal-total">$0.00</p>
        </div>
        <div>
          <h4>Spent</h4>
          <p id="modal-spent">$0.00</p>
        </div>
        <div>
          <h4>Remaining</h4>
          <p id="modal-remaining">$0.00</p>
        </div>
      </div>
      <h3>Expenses</h3>
      <div class="expense-list" id="modal-expenses">
        <!-- Expenses will be populated by JavaScript -->
      </div>
    </div>
  </div>

  <script src="expscript.js"></script>
</body>
</html>
